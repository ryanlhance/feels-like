<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Feels Like — a glance tells you what to wear and how it'll change over the next few hours, based on live weather and how you're getting around.">
  <title>Feels Like</title>

  <meta property="og:title" content="Feels Like">
  <meta property="og:description" content="What to wear — based on live weather and how you're getting around.">
  <meta property="og:image" content="assets/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" id="themeColor" content="#0b1026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Feels Like">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <style>
    :root{
      --text:#f1f4fb; --muted:#b3bcd2; --faint:#8b95b0;
      --glass:rgba(15,19,30,0.46); --inset:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.12); --line:rgba(255,255,255,0.10);
      /* cold→comfortable→hot ramp (blue → teal-green → amber → orange, Apple-style) */
      --cold:#2f6db0; --cool:#69a6d4; --neutral:#7cc486; --warm:#e7ad5f; --hot:#d4622f;
      --scale:linear-gradient(90deg,#3a6ea8 0%,#5fa0d0 38%,#86bcb6 52%,#7cc486 66%,#e3a052 82%,#d3612e 100%);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    /* NOTE: overflow:hidden on <html>/<body> clips the fixed background layers to the layout
       viewport on iOS, leaving the bottom screen inset showing the dark page color. Don't clip
       here — the no-scroll lock lives on #app (content fits, so nothing scrolls anyway). */
    html{height:100%;overscroll-behavior:none}
    /* iOS standalone bottom-band fix: on the home screen the layout viewport is 62px (=safe-top)
       shorter than the screen, so the body's cover-image stops short of the home-indicator inset and
       the flat fallback color shows. CSS units (even 100vh) do NOT grow the painting box here — only
       setting min-height to the real screen.height in PX at runtime forces iOS to expand the viewport
       to full height so the image fills edge to edge. That px value is applied in JS (fitScreen());
       100vh is just the pre-JS fallback. (Verified on device: px works, 100vh alone does not.) */
    body{
      min-height:100vh; overscroll-behavior:none; position:relative;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--text); -webkit-font-smoothing:antialiased; background:#0b1026;
    }
    button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
    svg{display:block}
    .ico{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .ico.fill{fill:currentColor;stroke:none}

    /* reactive sky — over-extend past the viewport edges so the background fills the
       whole screen on iOS Safari (fixed layers otherwise stop at the status bar / toolbar) */
    /* The scene lives on the <body> background, which propagates to the page canvas — the only
       surface that fills the ENTIRE screen on iOS (under the status bar + home-indicator insets).
       #precip is a light rain/snow overlay painted on top of it. */
    /* Scene lives on an ABSOLUTE element (not body-background, not fixed): body-background cover-sizing
       and position:fixed both clip to iOS's 812 layout viewport, leaving the home-indicator inset bare.
       An absolute child of the 874-tall (fitScreen) position:relative body paints the full height. */
    #scene{position:absolute;inset:0;z-index:-2;background-position:center;background-size:cover;background-repeat:no-repeat;pointer-events:none}
    #precip{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .9s ease}
    #precip.rain{opacity:.45;background-image:repeating-linear-gradient(101deg,rgba(255,255,255,0.15) 0 1px,transparent 1px 12px);background-size:100% 220px;animation:rain .5s linear infinite}
    #precip.snow{opacity:.8;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 60% 70%,rgba(255,255,255,.9),transparent),radial-gradient(1.6px 1.6px at 80% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 80%,rgba(255,255,255,.85),transparent);background-size:340px 340px,420px 420px,300px 300px,380px 380px;animation:snow 9s linear infinite}
    @keyframes rain{to{background-position:0 220px}}
    @keyframes snow{to{background-position:0 340px,-30px 420px,20px 300px,-10px 380px}}

    #app{height:100dvh;overflow:hidden;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
      padding:max(10px,env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));gap:9px}
    /* location bar pinned at top; the card stack centers in the space below */
    .stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:9px}

    /* top bar */
    .top{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .city{display:flex;align-items:center;gap:6px;font-size:.95rem;font-weight:600;letter-spacing:-.01em;min-width:0;text-shadow:0 1px 4px rgba(0,0,0,0.35)}
    .city .ico{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
    .city span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top .spacer{flex:1}
    /* dark glass pill (matches .iconbtn) so the °F/°C labels stay legible on light skies */
    .unit{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .unit button{padding:5px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}
    .unit button.on{background:var(--inset);color:var(--text)}
    .iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--muted)}
    .iconbtn:active{transform:scale(.94)}

    .card{background:var(--glass);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:0 8px 28px rgba(0,0,0,.16)}

    /* hero */
    /* weather — demoted to a compact supporting card */
    .weather{position:relative;padding:13px 16px}
    .weather .info{color:var(--faint)}
    .weather .info .ico{width:19px;height:19px}
    .wx-right{display:flex;align-items:flex-start;gap:8px}
    /* horizontal inset matches the temp bar (snowflake 15 + gap 8 = 23px) so the
       feels-like number lines up with the bar's left edge and actual with its right */
    .wx-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 0 0 23px}
    .wx-feel{display:flex;align-items:baseline;gap:9px;min-width:0}
    .feel-big{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1}
    .feel-word{font-size:.95rem;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
    .wx-actual{text-align:right;line-height:1.05;flex-shrink:0}
    .wx-a-num{display:block;font-size:1.05rem;font-weight:700;color:var(--text)}
    .wx-a-lbl{font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
    .scale{margin-top:13px;display:flex;align-items:center;gap:8px}
    .scale .end{color:var(--faint)}
    .scale .end .ico{width:15px;height:15px}
    .bar{position:relative;flex:1;height:5px;border-radius:3px;background:var(--scale)}
    .bar .mk{position:absolute;top:-5px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.32);transform:translateX(-50%);transition:left .4s ease}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
    .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;background:var(--inset);border:1px solid var(--line);font-size:.72rem;font-weight:600}
    .chip .ico{width:14px;height:14px}
    .chip.rain{color:#bcdcff} .chip.uv{color:#f4c98a} .chip.wind{color:#cdd6e6}

    /* scrubber */
    .scrub{flex:0 0 auto;padding:11px 16px}
    .scrub .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .scrub .when{font-size:.82rem;font-weight:600}
    .scrub .when .t{color:var(--muted);font-weight:500}
    .delta{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--inset)}
    .delta .ico{width:13px;height:13px}
    .delta.warm{color:var(--warm)} .delta.cool{color:var(--cool)} .delta.same{color:var(--faint)}
    input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
    .ticks{display:flex;justify-content:space-between;margin-top:6px;padding:0 2px}
    .ticks span{font-size:.58rem;color:var(--faint)}

    /* activity */
    .act{flex:0 0 auto;padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .act button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 2px;border-radius:13px;border:1.5px solid transparent;color:var(--muted);font-size:.66rem;font-weight:600}
    .act button .ico{width:22px;height:22px}
    .act button.on{border-color:var(--border);background:var(--inset);color:var(--text)}

    /* wear — the prominent answer card */
    .wear{padding:16px 17px}
    .fitgrid{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px 11px}
    .item{display:flex;flex-direction:column;align-items:center;gap:5px;width:62px;cursor:pointer}
    .item .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--inset);border:1px solid var(--line);color:var(--text);transition:border-color .12s,background .12s}
    .item:active .ic{transform:scale(.95)}
    .item.sel .ic{border-color:#6c8ef5;background:rgba(108,142,245,.22);color:#fff}
    .item .ic .ico{width:28px;height:28px}
    .item .nm{font-size:.62rem;text-align:center;line-height:1.15;color:var(--text)}
    .item .tag{font-size:.5rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-top:-2px}
    .fab{margin-top:14px;font-size:.7rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
    .fab .ico{width:15px;height:15px}
    .fab b{color:var(--text);font-weight:600}
    .layhint{font-size:.7rem;color:var(--faint);margin-top:9px;display:flex;align-items:center;gap:6px}
    .layhint .ico{width:14px;height:14px}

    /* pool glance */
    .pool{flex:0 0 auto;position:relative;padding:12px 16px;display:flex;align-items:flex-start;gap:13px}
    .pool .pic{margin-top:1px}
    .pool .info{margin-top:1px}
    .pool .pic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--inset);border:1px solid var(--line);flex-shrink:0;color:#bcdcff}
    .pool .pic .ico{width:20px;height:20px}
    .pool .mid{flex:1;min-width:0}
    .pool .vd{font-size:.88rem;font-weight:700}
    .pool .vd .vd-sub{color:var(--muted);font-weight:600}
    .cbar-row{display:flex;align-items:center;gap:7px;margin-top:8px}
    .cend{font-size:.5rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);flex-shrink:0}
    .cbar{position:relative;flex:1;height:5px;border-radius:3px;background:linear-gradient(90deg,#2f6db0,#69a6d4,#9fbfd0,#cdbfae)}
    .cbar .mk{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.3);transform:translateX(-50%)}
    .pool .info{color:var(--faint);flex-shrink:0}
    .pool .info .ico{width:19px;height:19px}

    .loc-line{font-size:.62rem;margin-top:-2px}
    .loc-line.err{color:#ff9a9a} .loc-line.live{color:#79e3a3}

    /* sheets */
    .scrim{position:fixed;inset:0;background:rgba(4,6,12,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
    .scrim.open{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;z-index:50;
      background:rgba(18,22,34,.96);backdrop-filter:blur(24px);border-radius:22px 22px 0 0;border-top:1px solid var(--border);
      padding:16px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s cubic-bezier(.3,.8,.3,1);max-height:82vh;overflow-y:auto}
    .sheet.open{transform:translateY(0)}
    .sheet h2{font-size:.92rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .sheet h2 .x{color:var(--muted)}
    .sub{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 8px}
    .srow{margin-bottom:14px}
    .srow .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:.8rem;color:var(--muted)}
    .srow .sh b{color:var(--text);font-size:1rem}
    .srow input[type=range]{background:var(--scale)}
    .srow input#humidSlider{background:linear-gradient(90deg,#7f93a8,#69a6d4)}
    .seg{display:flex;gap:5px}
    .seg button{flex:1;padding:7px 4px;border-radius:9px;border:1.5px solid var(--border);background:var(--inset);color:var(--muted);font-size:.7rem;font-weight:600}
    .seg button.on{border-color:#6c8ef5;background:rgba(108,142,245,.18);color:var(--text)}
    .togbtn{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--inset);color:var(--muted);font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
    .togbtn.on{border-color:#79e3a3;background:rgba(121,227,163,.12);color:#79e3a3}
    .det{font-size:.82rem;line-height:1.6;color:var(--muted)}
    .det b{color:var(--text)}
    .det .brow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
    .det .brow:last-child{border:none}
    .citysearch{display:flex;gap:6px;margin-bottom:6px}
    .citysearch input{flex:1;background:var(--inset);border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);font-size:.9rem;outline:none}
    .citysearch input:focus{border-color:#6c8ef5}
    .note{display:flex;gap:9px;padding:11px 13px;border-radius:12px;font-size:.76rem;line-height:1.5;border:1px solid;margin-top:10px}
    .note .ico{width:18px;height:18px;flex-shrink:0}
    .note.warn{border-color:rgba(228,138,63,.4);background:rgba(228,138,63,.1);color:#f0bd86}
    .note.cool{border-color:rgba(105,166,212,.4);background:rgba(105,166,212,.1);color:#bcdcff}
  </style>
</head>
<body>

<div id="scene"></div>
<div id="precip"></div>

<div id="app">

  <div class="top">
    <button class="city" onclick="openSheet('city')" aria-label="Change location">
      <svg class="ico" viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="cityName">Locating…</span>
    </button>
    <div class="spacer"></div>
    <div class="unit" role="group" aria-label="Units">
      <button id="btnF" class="on" onclick="setUnit('F')">°F</button>
      <button id="btnC" onclick="setUnit('C')">°C</button>
    </div>
    <button class="iconbtn" onclick="openSheet('cog')" aria-label="Adjust conditions">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg>
    </button>
  </div>

  <div class="stack">

  <!-- ACTIVITY (primary input — pick first) -->
  <div class="card act" id="actRow"></div>

  <!-- WEAR (the answer — prominent) -->
  <div class="card wear">
    <div class="fitgrid" id="fitGrid"></div>
    <div class="fab" id="fabricNote"></div>
  </div>

  <!-- SCRUBBER (shift the moment — there & back) -->
  <div class="card scrub" id="scrubCard">
    <div class="row">
      <div class="when"><span id="whenLbl">Now</span> <span class="t" id="whenTime"></span></div>
      <div class="delta same" id="delta" style="display:none"></div>
    </div>
    <input type="range" id="timeRange" min="0" max="6" step="1" value="0" aria-label="Hours from now">
    <div class="ticks"><span>Now</span><span>1h</span><span>2h</span><span>3h</span><span>4h</span><span>5h</span><span>6h</span></div>
    <div class="layhint" id="layHint" style="display:none"></div>
  </div>

  <!-- WEATHER (the why — demoted, compact) -->
  <div class="card weather">
    <div class="wx-main">
      <div class="wx-feel"><span class="feel-big" id="feelBig" aria-live="polite">—</span><span class="feel-word" id="feelWord">—</span></div>
      <div class="wx-right">
        <div class="wx-actual"><span class="wx-a-num" id="feelTemp">—</span><span class="wx-a-lbl">actual</span></div>
        <button class="info" onclick="openSheet('feel')" aria-label="Why it feels like this">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".3" class="fill" style="stroke:currentColor;stroke-width:1.6"/></svg>
        </button>
      </div>
    </div>
    <div class="scale">
      <span class="end"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v18M3.8 7.5l16.4 9M20.2 7.5 3.8 16.5"/></svg></span>
      <div class="bar"><div class="mk" id="feelMk"></div></div>
      <span class="end"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- POOL -->
  <div class="card pool">
    <div class="pic"><svg class="ico" viewBox="0 0 24 24"><path d="M15 9a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M6 11l4 -2l3.5 3l-1.5 2"/><path d="M3 16.75a2.4 2.4 0 0 0 1 .25a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 1 -.25"/></svg></div>
    <div class="mid">
      <div class="vd" id="poolVerdict">—</div>
      <div class="cbar-row">
        <span class="cend">cold</span>
        <div class="cbar"><div class="mk" id="poolMk"></div></div>
        <span class="cend">warm</span>
      </div>
    </div>
    <button class="info" onclick="openSheet('pool')" aria-label="Pool details">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".3" class="fill" style="stroke:currentColor;stroke-width:1.6"/></svg>
    </button>
  </div>

  </div><!-- /.stack -->

</div>

<!-- ═══ SHEETS ═══ -->
<div class="scrim" id="scrim" onclick="closeSheets()"></div>

<!-- City -->
<div class="sheet" id="sheet-city">
  <h2>Location <button class="x" onclick="closeSheets()"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h2>
  <div class="citysearch">
    <input type="text" id="locInput" placeholder="Search a city…" aria-label="Search a city">
    <button class="iconbtn" onclick="searchLocation()" aria-label="Search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></button>
  </div>
  <button class="togbtn" onclick="fetchLiveWeather()"><svg class="ico" viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg> Use my current location</button>
  <div class="loc-line" id="locLine"></div>
</div>

<!-- Cog: adjust -->
<div class="sheet" id="sheet-cog">
  <h2>Adjust conditions <button class="x" onclick="closeSheets()"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h2>
  <p class="det" style="font-size:.74rem;margin-bottom:6px">Override the live reading to plan for different conditions.</p>
  <div class="srow">
    <div class="sh">Temperature <b><span id="tDisp">65</span><span id="tU">°F</span></b></div>
    <input type="range" id="tempSlider" min="-10" max="105" value="65">
  </div>
  <div class="srow">
    <div class="sh">Humidity <b><span id="hDisp">45</span>%</b></div>
    <input type="range" id="humidSlider" min="0" max="100" value="45">
  </div>
  <div class="sub">Wind</div>
  <div class="seg" id="windSeg">

    coat:_jacket, jacket:_jacket, lightjacket:_jacket, shell:_jacket,

  function svg(n,cls){return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24">'+(I[n]||'')+'</svg>';}

  // ── State ──
  let unit='F', activity='short-walk';
  let tempF=65, humidity=45, wind='calm', sun='partial', shaded=false;
  let weekTempF=72, weekSun='mixed';
  let apparentF=null;
  let lat=null, lon=null, locationName='';
  let hourlyForecast=null, dataMode='manual';
  let offset=0;                 // hours from now (0-6)
  let now0=null;                // snapshot at offset 0 (for delta)
  let lastFit=[], fabricHTML='', selWear=null;  // wear card: items + tap-to-explain

  const ACTS={
    'short-walk':{name:'Walk',icon:'walk',speed:0,exert:0,windMult:1.0},
    'long-walk':{name:'Hike',icon:'longwalk',speed:0,exert:5,windMult:1.0},
    'run':{name:'Run',icon:'run',speed:0,exert:15,windMult:.85},
    'bike':{name:'Bike',icon:'bike',speed:-12,exert:5,windMult:.4},
    'scooter':{name:'Scoot',icon:'scooter',speed:-10,exert:0,windMult:.5},
    'moped':{name:'Moped',icon:'moped',speed:-18,exert:0,windMult:.2},
  };
  const WIND_OFF={calm:0,light:-4,moderate:-8,strong:-14};
  const SUN_OFF={full:8,partial:3,overcast:0};
  const WEEK_SUN={sunny:5,mixed:2,cloudy:-1};
  const STORE='feelslike.v3';

  // ── persistence ──
  function save(){try{localStorage.setItem(STORE,JSON.stringify({unit,activity,lat,lon,locationName}))}catch(e){}}
  function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||'{}');
    if(s.unit==='C'||s.unit==='F')unit=s.unit; if(s.activity&&ACTS[s.activity])activity=s.activity;
    if(typeof s.lat==='number'){lat=s.lat;lon=s.lon} if(s.locationName)locationName=s.locationName; return s;}catch(e){return{}}}

  // ── core ──
  function humidAdj(tF,h){if(tF>75)return Math.round((h-40)*.12);if(tF<45)return Math.round((h-40)*-.04);return 0;}
  function effTemp(tF,h,act,w,s,sh){const a=ACTS[act];return Math.round(tF+a.speed+a.exert+Math.round(WIND_OFF[w]*a.windMult)+(sh?0:SUN_OFF[s])+humidAdj(tF,h));}
  function computeEff(c){
    const a=ACTS[activity];
    if(c.apparentF!=null){let e=c.apparentF+a.speed+a.exert;if(shaded)e-=4;return Math.round(e);}
    return effTemp(c.tempF,c.humidity,activity,c.wind,c.sun,shaded);
  }
  function getComfort(eff){
    if(eff<20)return{w:'FREEZING'};if(eff<30)return{w:'VERY COLD'};if(eff<40)return{w:'COLD'};
    if(eff<50)return{w:'CHILLY'};if(eff<58)return{w:'COOL'};if(eff<65)return{w:'MILD'};
    if(eff<72)return{w:'PERFECT'};if(eff<80)return{w:'WARM'};if(eff<90)return{w:'HOT'};return{w:'VERY HOT'};
  }
  function feelColor(eff){const st=[[10,'#3a6ea8'],[30,'#4a8ac4'],[44,'#6aa6cf'],[54,'#86bcb6'],[62,'#74bd9b'],[69,'#7cc486'],[75,'#c8b86c'],[82,'#e3a052'],[89,'#df8740'],[95,'#d3612e']];let c=st[0][1];for(const[t,col]of st)if(eff>=t)c=col;return c;}
  function dT(tF){return unit==='F'?Math.round(tF)+'°':Math.round((tF-32)*5/9)+'°';}
  function markerPct(eff){return Math.max(2,Math.min(98,((eff+10)/115)*100));}

  function getFabric(eff,h){
    if(eff>=78&&h>=45)return{c:'Linen',i:'linen',r:'Hot & humid — linen breathes and dries far better than cotton.'};
    if(eff>=70&&h>=55)return{c:'Linen',i:'linen',r:'Warm and muggy — linen stays cooler and wicks moisture.'};
    if(eff>=72)return{c:'Linen / cotton',i:'linen',r:'Warm but dry — either works; linen is slightly cooler.'};
    if(eff>=58)return{c:'Cotton',i:'shortsleeve',r:'Mild — cotton is comfortable and easy.'};
    return{c:'Cotton',i:'longsleeve',r:'Cool — cotton holds a little more warmth than linen.'};
  }

  function precipKind(code){if(code==null)return null;if(code>=95)return'storm';if((code>=71&&code<=77)||code===85||code===86)return'snow';if((code>=51&&code<=67)||(code>=80&&code<=82))return'rain';return null;}
  function getOutfit(eff,h,c){
    const it=[], T=dT(eff);
    if(eff<28)it.push({i:'coat',n:'Heavy Coat',l:1,why:'Feels like '+T+' — serious cold.'});
    else if(eff<45)it.push({i:'jacket',n:'Jacket',l:1,why:'Feels like '+T+' — you’ll want it.'});
    else if(eff<58)it.push({i:'lightjacket',n:'Light Jacket',l:0,why:'Cool enough to want a layer.'});
    if(eff<55)it.push({i:'hoodie',n:'Hoodie',l:1,why:'A warm mid-layer takes the edge off.'});
    else if(eff<65)it.push({i:'hoodie',n:'Hoodie',l:0,why:'Optional — it’s borderline.'});
    if(eff<60)it.push({i:'longsleeve',n:'Long Sleeve',l:1,why:'Keeps your arms covered at '+T+'.'});
    else if(eff<82)it.push({i:'shortsleeve',n:'Short Sleeve',l:1,why:'Warm enough for bare arms.'});
    else it.push({i:'linen',n:'Flowy Linen',l:1,why:'Hot — go light and breezy.'});
    if(eff<48)it.push({i:'warmpants',n:'Warm Pants',l:1,why:'Cold — keep your legs covered.'});
    else if(eff<65)it.push({i:'pants',n:'Pants',l:1,why:'Legs covered at '+T+'.'});
    else if(eff<75)it.push({i:'pants',n:'Pants or Shorts',l:1,why:'Comfortable either way at '+T+' — your call.'});
    else it.push({i:'shorts',n:'Shorts',l:1,why:'Warm enough for bare legs.'});
    // winter accessories travel together — one item, all or nothing
    if(eff<25)it.push({i:'scarf',n:'Accessories',l:1,why:'Cold enough for a hat, gloves and a scarf.'});
    else if(eff<40)it.push({i:'scarf',n:'Accessories',l:0,why:'A hat, gloves or scarf if you run cold.'});
    // snow needs a waterproof outer layer (still "what to wear")
    if(c && precipKind(c.code)==='snow')it.push({i:'shell',n:'Waterproof',l:1,why:'Snow expected — a waterproof shell keeps you dry.'});
    return it;
  }

  // ── pool ──
  function estimatePool(wk,wks,tF,s){let p=(wk*.65+tF*.35)-10;p+=WEEK_SUN[wks];p+=s==='full'?2:s==='partial'?1:0;return Math.max(50,Math.min(95,Math.round(p)));}
  function poolGlance(pt,air,w,s){
    // Three states: swim · cold plunge (with a max duration) · neither.
    let vd,go;
    if(pt>=74){ vd = air>=72 ? 'Enjoy Your Pool Day' : 'Pool’s Warm, Air Is Cool'; go=2; }
    else if(pt>=68){ vd='Not Pool Weather'; go=0; }          // lukewarm — too cool to swim, too warm to plunge
    else if(pt>=45){
      const mins = pt<50?'2–4':pt<56?'5–10':pt<62?'10–15':'15–20';
      vd='Cold Plunge · '+mins+' min max'; go=1;
    }
    else{ vd='Not Pool Weather'; go=0; }                     // dangerously cold (detail in the info sheet)
    const sub = pt<60?'Water is very cold':pt<68?'Water is cold':pt<74?'Water is cool':pt<82?'Water is comfortable':'Water is warm';
    return{vd,sub,go,pt};
  }
  function coldTherapy(pt){
    if(pt>=68)return null;
    if(pt<45)return{cls:'warn',i:'snow',t:'<b>Dangerously cold.</b> Risk of cold shock — not safe for immersion.'};
    if(pt<56)return{cls:'cool',i:'snow',t:'<b>Prime cold-therapy range.</b> ~'+dT(pt)+' is ideal for recovery — limit to 10–15 min.'};
    if(pt<62)return{cls:'cool',i:'snow',t:'<b>Good cold-therapy range.</b> Real recovery benefit, easier than an ice bath.'};
    return{cls:'cool',i:'snow',t:'<b>Mild cold therapy.</b> Warmer edge — some benefit for soreness.'};
  }

  function getAdvice(eff,c){
    const a=ACTS[activity];let m='For a <b>'+a.name.toLowerCase()+'</b>: ';
    if(eff<25)m+='real cold — protect your extremities and layer up.';
    else if(eff<35)m+='bundle up; a proper jacket and warm layers are a must.';
    else if(eff<45)m+='cold enough to feel it — full jacket and long layers.';
    else if(eff<55)m+='cool; a light jacket or heavy hoodie keeps you comfortable.';
    else if(eff<62)m+='mild — a light layer is a smart safety net.';
    else if(eff<70)m+='comfortable; short sleeves work well.';
    else if(eff<80)m+='warm — light clothing, shorts are great.';
    else m+='hot — go as light as possible and hydrate.';
    if(activity==='moped')m+=' Moped headwind is significant — even mild days feel much colder at speed.';
    else if(activity==='run')m+=' You heat up fast running — dress lighter than feels right.';
    else if(activity==='bike')m+=' Biking makes its own breeze — you\'ll feel cooler than standing still.';
    if(c){const k=precipKind(c.code),p=c.precipProb;
      if(k==='storm')m+=' Thunderstorms expected — consider waiting it out.';
      else if(k==='snow')m+=' Snow in the forecast — watch for slick footing.';
      else if(k==='rain')m+=p!=null?' '+p+'% chance of rain — bring cover.':' Rain in the forecast — bring cover.';
      if(c.isDay&&c.uv!=null&&c.uv>=6)m+=' UV '+Math.round(c.uv)+' — sunscreen is worth it.';}
    return m;
  }

  // ── snapshot of conditions at offset hours ──
  function hourIndex(d){if(!hourlyForecast)return -1;const p=n=>String(n).padStart(2,'0');return hourlyForecast.time.indexOf(`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:00`);}
  function snapshotAt(offs){
    if(!hourlyForecast)return null;
    const d=new Date();d.setHours(d.getHours()+offs);

      windMph:mph, wind:mph<6?'calm':mph<13?'light':mph<21?'moderate':'strong',
      sun:(H.is_day&&H.is_day[i]===0)?'overcast':cc<25?'full':cc<65?'partial':'overcast',
      code:H.weather_code?H.weather_code[i]:null, precipProb:H.precipitation_probability?H.precipitation_probability[i]:null,
      uv:H.uv_index?H.uv_index[i]:null, isDay:H.is_day?H.is_day[i]===1:true, time:d};
  }

    if(dataMode==='live'&&hourlyForecast){const s=snapshotAt(offset);if(s)return s;}
    return {tempF,humidity,apparentF:dataMode==='live'?apparentF:null,windMph:null,wind,sun,
      code:null,precipProb:null,uv:null,isDay:true,time:new Date()};
  }

  // ── reactive sky ──
  const SCENES={
    'clear-day':{g:['#1f6fd4','#479ddf','#8ecdf0'],glow:'rgba(255,246,200,.55)',gp:'78% 16%',p:'',img:'clear-day'},
    'clear-night':{g:['#070b1f','#121a3e','#202a58'],glow:'rgba(200,212,255,.3)',gp:'24% 18%',p:'',img:'clear-night'},

    'fog-day':{g:['#8a9399','#aab4bd','#cdd4da'],glow:'rgba(255,255,255,.18)',gp:'50% 30%',p:'',img:'fog'},
    'fog-night':{g:['#20262f','#313945','#454f5d'],glow:'rgba(120,130,140,.18)',gp:'50% 30%',p:'',img:'fog'},
    'rain-day':{g:['#44525f','#5e6f7e','#74858f'],glow:'rgba(220,230,236,.12)',gp:'50% 8%',p:'rain',img:'rain'},
    'rain-night':{g:['#10161f','#1d2630','#2a3540'],glow:'rgba(120,140,160,.12)',gp:'50% 10%',p:'rain',img:'rain'},
    'snow-day':{g:['#6f7f93','#97a7b8','#c6d2dd'],glow:'rgba(255,255,255,.22)',gp:'50% 12%',p:'snow',img:'snow'},
    'snow-night':{g:['#1a2230','#2b3647','#3c4860'],glow:'rgba(200,212,228,.16)',gp:'50% 12%',p:'snow',img:'snow'},
    'storm-day':{g:['#2b3340','#3d4658','#515b6f'],glow:'rgba(180,190,205,.1)',gp:'50% 8%',p:'rain',img:'storm'},

    'sunrise':{g:['#f4a259','#ea7e8a','#5a6bb0'],glow:'rgba(255,217,160,.55)',gp:'50% 78%',p:'',img:'sunrise'},

  };
  function sceneKey(c){
    const isDay=c.isDay!=null?c.isDay:true, sx=isDay?'day':'night', k=precipKind(c.code);
    if(c.code!=null){
      if(k==='storm')return'storm-'+sx; if(k==='snow')return'snow-'+sx; if(k==='rain')return'rain-'+sx;
      if(c.code===45||c.code===48)return'fog-'+sx; if(c.code===3)return'overcast-'+sx; if(c.code===2)return'partly-'+sx;
      return'clear-'+sx;
    }
    if(c.sun==='overcast')return'overcast-'+sx; if(c.sun==='partial')return'partly-'+sx; return'clear-'+sx;
  }
  const imgCache={};
  function applyScene(c){
    const sc=SCENES[sceneKey(c)]||SCENES['clear-night'];
    const grad=`linear-gradient(180deg,${sc.g[0]},${sc.g[1]} 52%,${sc.g[2]})`;
    document.getElementById('precip').className=sc.p||'';
    document.getElementById('themeColor').setAttribute('content',sc.g[0]);
    // Paint the scene onto the absolute #scene element (fills the full 874 body — see #scene CSS).
    // Gradient is the fallback while the image loads; body background-color (g[2]) is a final safety
    // net so nothing flashes white/dark behind #scene during that load.
    const url='assets/scene-'+sc.img+'.jpg';
    const scene=document.getElementById('scene');
    const paint=img=>{
      scene.style.backgroundImage=(img?`url("${url}"), `:'')+grad;
      document.body.style.backgroundColor=sc.g[2];
    };
    if(imgCache[url]==='ok'){paint(true);}
    else{
      paint(false);
      if(imgCache[url]!=='loading'){
        imgCache[url]='loading';
        const p=new Image();
        p.onload=()=>{imgCache[url]='ok';if(sceneKey(currentConditions())===sceneKey(c))paint(true);};
        p.onerror=()=>{imgCache[url]=undefined;};
        p.src=url;
      }
    }
  }

  // ── render ──
  function render(){
    const c=currentConditions();
    const eff=computeEff(c), cm=getComfort(eff), col=feelColor(eff);
    document.getElementById('feelBig').textContent=dT(eff);
    document.getElementById('feelBig').style.color=col;
    document.getElementById('feelWord').textContent=cm.w;
    document.getElementById('feelWord').style.color=col;
    document.getElementById('feelTemp').textContent=dT(c.tempF);
    document.getElementById('feelMk').style.left=markerPct(eff)+'%';

    // wear answer (the hero) — tie it to the activity
    lastFit=getOutfit(eff,c.humidity,dataMode==='live'?c:null);
    document.getElementById('fitGrid').innerHTML=lastFit.map((o,idx)=>
      '<div class="item" onclick="wearWhy('+idx+')"><div class="ic">'+svg(o.i)+'</div><div class="nm">'+o.n+'</div>'+(o.l?'':'<div class="tag">optional</div>')+'</div>').join('');
    const fb=getFabric(eff,c.humidity);
    fabricHTML=svg(fb.i)+'<span>Best in <b>'+fb.c.toLowerCase()+'</b></span>';
    document.getElementById('fabricNote').innerHTML=fabricHTML;
    selWear=null;

    // chips
    const chips=[];const k=precipKind(c.code);
    if(c.precipProb!=null&&(k||c.precipProb>=10))chips.push('<span class="chip rain">'+svg('drop')+c.precipProb+'%</span>');
    if(c.isDay&&c.uv!=null&&c.uv>=3)chips.push('<span class="chip uv">'+svg('sun')+'UV '+Math.round(c.uv)+'</span>');
    if(c.windMph!=null){const ws=unit==='F'?Math.round(c.windMph)+' mph':Math.round(c.windMph*1.609)+' km/h';chips.push('<span class="chip wind">'+svg('wind')+ws+'</span>');}
    document.getElementById('chips').innerHTML=chips.join('');

    // delta vs now + a layering hint for the round trip
    const dEl=document.getElementById('delta'), lh=document.getElementById('layHint');
    if(dataMode==='live'&&now0&&offset>0){
      const nowEff=computeEff(now0), diff=eff-nowEff;
      dEl.style.display='';
      if(Math.abs(diff)<2){dEl.className='delta same';dEl.innerHTML='≈ same as now';}
      else{const warm=diff>0;dEl.className='delta '+(warm?'warm':'cool');dEl.innerHTML=svg(warm?'up':'down')+(warm?'+':'')+(unit==='F'?diff:Math.round(diff*5/9))+'° vs now';}
      let hint='';
      if(diff<=-6)hint=svg('down')+'Cooler later — bring a layer for the way back.';
      else if(diff>=6)hint=svg('up')+'Warmer later — you can shed a layer.';
      lh.innerHTML=hint;lh.style.display=hint?'':'none';
    } else {dEl.style.display='none';lh.style.display='none';}

    // pool
    const pt=estimatePool(weekTempF,weekSun,c.tempF,c.sun), pg=poolGlance(pt,c.tempF,c.wind,c.sun);
    {const pv=pg.vd.split(' · ');document.getElementById('poolVerdict').innerHTML=pv[0]+(pv[1]?' <span class="vd-sub">· '+pv[1]+'</span>':'');}
    document.getElementById('poolMk').style.left=Math.max(3,Math.min(97,(pt-50)/45*100))+'%';

    // detail sheets (kept fresh)
    document.getElementById('adviceDet').innerHTML=getAdvice(eff,dataMode==='live'?c:null);
    document.getElementById('breakdownDet').innerHTML=breakdownHTML(c,eff);
    const ct=coldTherapy(pt);
    document.getElementById('poolDet').innerHTML=
      '<div class="brow"><span>Verdict</span><b>'+pg.vd+'</b></div>'+
      '<div class="brow"><span>Water</span><b>'+pg.sub+' · ~'+dT(pt)+'</b></div>'+
      '<div class="brow"><span>Air</span><b>'+dT(c.tempF)+'</b></div>';
    document.getElementById('coldDet').innerHTML=ct?'<div class="note '+ct.cls+'">'+svg(ct.i)+'<div>'+ct.t+'</div></div>':'';

    applyScene(c);
  }
  function breakdownHTML(c,eff){
    const a=ACTS[activity];let h='';
    h+='<div class="brow"><span>Air temperature</span><b>'+dT(c.tempF)+'</b></div>';
    if(c.apparentF!=null)h+='<div class="brow"><span>Apparent (wind, sun, humidity)</span><b>'+dT(c.apparentF)+'</b></div>';
    if(a.exert)h+='<div class="brow"><span>Body heat ('+a.name.toLowerCase()+')</span><b>+'+(unit==='F'?a.exert:Math.round(a.exert*5/9))+'°</b></div>';
    if(a.speed)h+='<div class="brow"><span>Headwind at speed</span><b>'+(unit==='F'?a.speed:Math.round(a.speed*5/9))+'°</b></div>';
    if(shaded)h+='<div class="brow"><span>Shaded route</span><b>-'+(unit==='F'?4:2)+'°</b></div>';
    h+='<div class="brow"><span>Feels like</span><b style="color:'+feelColor(eff)+'">'+dT(eff)+'</b></div>';
    return h;
  }

  // ── activity row ──
  function buildActivity(){
    document.getElementById('actRow').innerHTML=Object.entries(ACTS).map(([k,a])=>
      '<button class="'+(k===activity?'on':'')+'" data-a="'+k+'" onclick="setActivity(\''+k+'\')">'+svg(a.icon)+'<span>'+a.name+'</span></button>').join('');
  }
  function setActivity(k){activity=k;document.querySelectorAll('#actRow button').forEach(b=>b.classList.toggle('on',b.dataset.a===k));save();render();}

  // tap a wear item → show its one-line reason in the fabric line; tap again to dismiss
  function wearWhy(i){
    const items=document.querySelectorAll('#fitGrid .item'), note=document.getElementById('fabricNote');
    if(selWear===i){selWear=null;items.forEach(x=>x.classList.remove('sel'));note.innerHTML=fabricHTML;return;}
    selWear=i;items.forEach((x,j)=>x.classList.toggle('sel',j===i));
    const o=lastFit[i];if(o)note.innerHTML=svg(o.i)+'<span>'+o.why+'</span>';
  }

  // ── scrubber ──
  document.getElementById('timeRange').addEventListener('input',function(){
    offset=parseInt(this.value);
    const lbl=document.getElementById('whenLbl'),tEl=document.getElementById('whenTime');
    if(offset===0){lbl.textContent='Now';tEl.textContent='';}
    else{const d=new Date();d.setHours(d.getHours()+offset);lbl.textContent='In '+offset+'h';tEl.textContent='· '+d.toLocaleTimeString([],{hour:'numeric'});}
    render();
  });
  function syncScrubVisibility(){document.getElementById('scrubCard').style.opacity=(dataMode==='live'&&hourlyForecast)?'1':'.4';document.getElementById('timeRange').disabled=!(dataMode==='live'&&hourlyForecast);}

  // ── units ──
  function setUnit(u){unit=u;document.getElementById('btnF').classList.toggle('on',u==='F');document.getElementById('btnC').classList.toggle('on',u==='C');
    document.getElementById('tU').textContent=u==='F'?'°F':'°C';document.getElementById('wtU').textContent=u==='F'?'°F':'°C';
    syncCog();save();render();}

  // ── cog (manual) ──
  function manualEdit(){dataMode='manual';apparentF=null;offset=0;document.getElementById('timeRange').value=0;document.getElementById('whenLbl').textContent='Now';document.getElementById('whenTime').textContent='';syncScrubVisibility();render();}
  function syncCog(){
    const c=unit==='C';
    const ts=document.getElementById('tempSlider'),ws=document.getElementById('weekTempSlider');
    if(c){ts.min=-23;ts.max=41;ts.value=Math.round((tempF-32)*5/9);ws.min=-23;ws.max=41;ws.value=Math.round((weekTempF-32)*5/9);}
    else{ts.min=-10;ts.max=105;ts.value=tempF;ws.min=-10;ws.max=105;ws.value=weekTempF;}
    document.getElementById('tDisp').textContent=ts.value;document.getElementById('wtDisp').textContent=ws.value;
    document.getElementById('hDisp').textContent=humidity;document.getElementById('humidSlider').value=humidity;
    document.querySelectorAll('#windSeg button').forEach(b=>b.classList.toggle('on',b.dataset.w===wind));
    document.querySelectorAll('#skySeg button').forEach(b=>b.classList.toggle('on',b.dataset.s===sun));
    document.querySelectorAll('#wsunSeg button').forEach(b=>b.classList.toggle('on',b.dataset.ws===weekSun));
    document.getElementById('shadeTog').classList.toggle('on',shaded);
  }
  document.getElementById('tempSlider').addEventListener('input',function(){const v=parseInt(this.value);document.getElementById('tDisp').textContent=v;tempF=unit==='F'?v:Math.round(v*9/5+32);manualEdit();});
  document.getElementById('humidSlider').addEventListener('input',function(){humidity=parseInt(this.value);document.getElementById('hDisp').textContent=humidity;manualEdit();});
  document.getElementById('weekTempSlider').addEventListener('input',function(){const v=parseInt(this.value);document.getElementById('wtDisp').textContent=v;weekTempF=unit==='F'?v:Math.round(v*9/5+32);render();});
  document.getElementById('windSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;wind=b.dataset.w;syncCog();manualEdit();});
  document.getElementById('skySeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sun=b.dataset.s;syncCog();manualEdit();});
  document.getElementById('wsunSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;weekSun=b.dataset.ws;syncCog();render();});
  function toggleShade(){shaded=!shaded;document.getElementById('shadeTog').classList.toggle('on',shaded);render();}

  // ── sheets ──
  function openSheet(id){closeSheets();document.getElementById('scrim').classList.add('open');document.getElementById('sheet-'+id).classList.add('open');if(id==='cog')syncCog();if(id==='city')setTimeout(()=>document.getElementById('locInput').focus(),250);}
  function closeSheets(){document.getElementById('scrim').classList.remove('open');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));}
  document.getElementById('locInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchLocation();});

  // ── location + weather ──
  function setLoc(state,txt){const el=document.getElementById('locLine');el.className='loc-line'+(state==='live'?' live':state==='error'?' err':'');el.textContent=txt;}
  function setCity(name){document.getElementById('cityName').textContent=name;}

  async function fetchWeather(){
    if(lat==null)return;
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,cloud_cover,wind_speed_10m,uv_index&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,weather_code,cloud_cover,wind_speed_10m,uv_index,is_day&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&past_days=7&forecast_days=2`;
    const res=await fetch(url);if(!res.ok)throw new Error('w'+res.status);
    const d=await res.json();hourlyForecast=d.hourly;dataMode='live';offset=0;document.getElementById('timeRange').value=0;
    const cur=d.current;tempF=cur.temperature_2m;humidity=cur.relative_humidity_2m;apparentF=cur.apparent_temperature;
    const mph=cur.wind_speed_10m,cc=cur.cloud_cover;
    wind=mph<6?'calm':mph<13?'light':mph<21?'moderate':'strong';sun=cur.is_day===0?'overcast':cc<25?'full':cc<65?'partial':'overcast';
    now0=snapshotAt(0)||{tempF,humidity,apparentF,wind,sun,code:cur.weather_code,precipProb:null,uv:cur.uv_index,isDay:cur.is_day===1,windMph:mph};
    // give "now" its live extras
    now0.code=cur.weather_code;now0.isDay=cur.is_day===1;now0.windMph=mph;if(now0.uv==null)now0.uv=cur.uv_index;
    // pool week avg
    const dy=d.daily,past=dy.temperature_2m_max.slice(0,7).map((mx,i)=>(mx+dy.temperature_2m_min[i])/2);
    weekTempF=Math.round(past.reduce((a,b)=>a+b,0)/past.length);
    const H=d.hourly,samp=H.time.reduce((ac,t,i)=>{const dt=new Date(t),ago=(Date.now()-dt.getTime())/864e5,h=dt.getHours();if(ago>=0&&ago<7&&h>=10&&h<=16)ac.push(H.cloud_cover[i]);return ac;},[]);
    const avg=samp.length?samp.reduce((a,b)=>a+b,0)/samp.length:50;weekSun=avg<30?'sunny':avg<65?'mixed':'cloudy';
    document.getElementById('whenLbl').textContent='Now';document.getElementById('whenTime').textContent='';
    syncScrubVisibility();syncCog();render();
  }

  async function fetchLiveWeather(){
    setLoc('loading','Getting your location…');
    try{
      const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000}));
      lat=pos.coords.latitude;lon=pos.coords.longitude;
      const[,g]=await Promise.all([fetchWeather(),fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&format=json`)]);
      const geo=await g.json(),ad=geo.address||{};
      const city=ad.city||ad.town||ad.village||ad.county||'Your location';
      const st=ad['ISO3166-2-lvl4']?ad['ISO3166-2-lvl4'].split('-').pop():(ad.state||'');
      locationName=city+(st?', '+st:'');setCity(locationName);
      setLoc('live',locationName+' · updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));save();
      setTimeout(closeSheets,400);
    }catch(e){if(e&&e.code===1)setLoc('error','Location denied — search a city instead.');else setLoc('error','Could not get location — search a city.');}
  }

  async function searchLocation(){
    const q=document.getElementById('locInput').value.trim();if(!q)return;setLoc('loading','Searching "'+q+'"…');
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
      const d=await r.json();if(!d.results?.length){setLoc('error','"'+q+'" not found');return;}
      const x=d.results[0];lat=x.latitude;lon=x.longitude;
      locationName=x.name+(x.admin1?', '+x.admin1:'')+(x.country_code&&x.country_code!=='US'?', '+x.country_code:'');setCity(locationName);
      await fetchWeather();setLoc('live',locationName+' · updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));save();
      setTimeout(closeSheets,400);
    }catch(e){setLoc('error','Search failed — check your connection.');}
  }

  // auto refresh on return
  let hid=null;
  document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();return;}if(lat!=null&&hid&&Date.now()-hid>6e5)fetchWeather().catch(()=>{});});

  // iOS standalone: the layout viewport is shorter than the screen, so the scene image stops above the
  // home-indicator inset. Force the body box to the real screen height in px (CSS units don't expand
  // the viewport here). Re-run across every event where iOS may (re)settle the viewport.
  function fitScreen(){document.body.style.minHeight=screen.height+'px';}
  ['load','pageshow','resize','orientationchange'].forEach(ev=>
    addEventListener(ev,()=>{fitScreen();setTimeout(fitScreen,250);}));
  fitScreen();setTimeout(fitScreen,300);setTimeout(fitScreen,1000);

  // TEMP on-screen stamp — tells new-build-vs-stale-cache apart and reads the real viewport on device.
  // (ih=innerHeight, vv=visualViewport, sh=screen.height, bh=body height.) Removed once confirmed.
  (function(){
    const s=document.createElement('div');
    s.style.cssText='position:fixed;left:50%;transform:translateX(-50%);z-index:99999;pointer-events:none;'
      +'top:calc(env(safe-area-inset-top) + 4px);'
      +'font:10px/1.2 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.62);'
      +'padding:3px 7px;border-radius:6px;white-space:nowrap;letter-spacing:.02em';
    document.body.appendChild(s);
    const vv=()=>window.visualViewport?Math.round(visualViewport.height):'-';
    const upd=()=>{const sc=document.getElementById('scene');
      s.textContent='v29 · ih'+innerHeight+' cl'+document.documentElement.clientHeight+' sh'+screen.height
        +' bh'+document.body.offsetHeight+' sb'+(sc?Math.round(sc.getBoundingClientRect().bottom):'-');};
    upd();setInterval(upd,500);addEventListener('resize',upd);
  })();

  // ── init ──
  const saved=load();
  buildActivity();setUnit(unit);render();
  if(saved.lat!=null){setCity(locationName);setLoc('loading','Updating…');fetchWeather().then(()=>setLoc('live',locationName+' · updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))).catch(()=>setLoc('error','Could not refresh.'));}
  else{setCity('Set location');fetchLiveWeather();}
  if('serviceWorker'in navigator){
    // auto-reload once when a new service worker takes control, so a fresh deploy can't be masked by
    // a stale cached page (the classic "looks exactly the same after deploy" trap).
    let swReloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!swReloaded){swReloaded=true;location.reload();}});
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
