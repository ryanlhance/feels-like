<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Feels Like — Offline</title>
  <style>
    *{margin:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      padding:32px;color:#eef1fa;background:linear-gradient(180deg,#0b1026,#1a2350 55%,#2a3570)}
    .ic{width:72px;height:72px;margin-bottom:22px;opacity:.9}
    h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
    p{font-size:.95rem;line-height:1.5;color:#b3bcd2;max-width:300px;margin-bottom:24px}
    button{font:inherit;font-weight:700;font-size:.9rem;color:#fff;background:rgba(108,142,245,.9);
      border:none;border-radius:14px;padding:12px 26px;cursor:pointer}
    button:active{transform:scale(.96)}
  </style>
</head>
<body>
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#cdd6e6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 16a4 4 0 0 1 .8-7.9A6 6 0 0 1 17 8a3.5 3.5 0 0 1 1 6.8"/>
    <path d="M3 3l18 18"/>
  </svg>
  <h1>You're offline</h1>
  <p>Feels Like needs a connection to pull live weather. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
